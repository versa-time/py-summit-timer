name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.artifact-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-name: SummitLink-macOS-arm64
            archive-name: SummitLink-macOS-arm64.zip
          - os: macos-15-intel
            artifact-name: SummitLink-macOS-x64
            archive-name: SummitLink-macOS-x64.zip
          - os: windows-latest
            artifact-name: SummitLink-Windows-x64
            archive-name: SummitLink-Windows-x64.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PDM
        run: python -m pip install pdm

      - name: Install dependencies
        run: pdm install -G dev -G gui -G build

      - name: Run tests
        run: pdm run pytest

      - name: Build PyInstaller app
        run: pdm run build-app

      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/SummitLink.app" "${{ matrix.archive-name }}"

      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/SummitLink" -DestinationPath "${{ matrix.archive-name }}"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.archive-name }}
